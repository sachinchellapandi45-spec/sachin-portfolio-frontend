<div class="admin-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-logo">CS</div><div class="brand-info"><div class="brand-name">Portfolio Admin</div><div class="brand-role">Sachin C</div></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="visitors.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Visitors</a>
      <a href="contacts.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Messages</a>
      <div class="nav-section-label" style="margin-top:1rem">Content</div>
      <a href="projects.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>Projects</a>
      <a href="skills.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Skills</a>
      <div class="nav-section-label" style="margin-top:1rem">Portfolio</div>
      <a href="../index.html" target="_blank" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View Portfolio</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-user"><div class="user-avatar">SC</div><div><div class="user-name" id="sidebarUsername">Admin</div><div class="user-role">● Admin</div></div></div><button class="btn-logout" id="logoutBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div class="topbar-left"><button class="hamburger-btn" id="hamburgerBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><span class="page-title">Skills</span></div>
      <div class="topbar-right"><button class="btn btn-primary" id="addSkillBtn">＋ Add Skill</button></div>
    </div>
    <div class="page-content">
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Icon</th><th>Name</th><th>Category</th><th>Level</th><th>Order</th><th>Active</th><th>Actions</th></tr></thead>
            <tbody id="skillsBody"><tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="skillModal">
  <div class="modal">
    <div class="modal-header"><span class="modal-title" id="skillModalTitle">Add Skill</span><button class="modal-close" onclick="closeModal('skillModal')">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="skillId"/>
      <div class="form-group"><label class="form-label">Skill Name *</label><input type="text" id="skillName" class="form-control" placeholder="e.g. Java"/></div>
      <div class="form-group"><label class="form-label">Category</label>
        <select id="skillCategory" class="form-control">
          <option value="Languages">Languages</option>
          <option value="Backend">Backend</option>
          <option value="Frontend">Frontend</option>
          <option value="Database">Database</option>
          <option value="Tools">Tools</option>
          <option value="Cloud">Cloud</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Proficiency: <span id="percentageDisplay">80</span>%</label>
        <input type="range" id="skillPercentage" class="form-control" min="10" max="100" value="80" step="5" style="padding:0;border:none;background:none" oninput="document.getElementById('percentageDisplay').textContent=this.value"/>
      </div>
      <div class="form-group"><label class="form-label">Icon URL (CDN / DevIcons)</label><input type="url" id="skillIcon" class="form-control" placeholder="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg"/></div>
      <div class="form-group"><label class="form-label">Display Order</label><input type="number" id="skillOrder" class="form-control" value="0" min="0"/></div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <input type="checkbox" id="skillActive" checked style="width:16px;height:16px;accent-color:var(--neon-blue)"/>
        <label class="form-label" for="skillActive" style="margin:0">Show on Portfolio</label>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('skillModal')">Cancel</button><button class="btn btn-primary" id="saveSkillBtn" onclick="saveSkill()">Save Skill</button></div>
  </div>
</div>

<script src="../config.js"></script>
<script src="js/api.js"></script>
<script src="js/skills.js"></script>
</body>
</html>
