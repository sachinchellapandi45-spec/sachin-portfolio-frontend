# =============================================
# LOCAL DEVELOPMENT Configuration
# =============================================

# Server
server.port=8080

# =============================================
# Database — override with env vars for prod
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Havoc@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
# JWT — override secret in production!
# =============================================
app.jwt.secret=${JWT_SECRET:SachinPortfolio2026VeryLongSecretKeyForJWTHMACSHA256SigningDoNotShareThis}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================
# CORS — add your GitHub Pages URL in prod
# =============================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,null}

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# =============================================
# Logging
# =============================================
logging.level.com.sachin.portfolio=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# =============================================
# App Info
# =============================================
spring.application.name=sachin-portfolio-backend
