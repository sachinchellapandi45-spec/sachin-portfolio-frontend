# Production profile — used when SPRING_PROFILES_ACTIVE=prod
# Render.com injects DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET as env vars

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Allow GitHub Pages origin — set CORS_ORIGINS on Render
app.cors.allowed-origins=${CORS_ORIGINS:https://sachinchellapandi45-spec.github.io}

logging.level.root=WARN
logging.level.com.sachin.portfolio=INFO
